on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install the Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install the Capacitor Android libraries
        run: npm install --no-audit --no-fund
      - name: Keep a signing key in the project
        run: |
          if [ ! -f android/keystore/drc-tourbillion.p12 ]; then
            mkdir -p android/keystore
            keytool -genkeypair -keystore android/keystore/drc-tourbillion.p12 -storetype PKCS12 \
              -alias drc-tourbillion -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass drc-tourbillion -keypass drc-tourbillion \
              -dname "CN=DRC Golf Tourbillion, O=DRC Golf Tourbillion, L=Brisbane, ST=Queensland, C=AU"
            git config user.name 'DRC Golf Tourbillion build'
            git config user.email 'actions@users.noreply.github.com'
            git add -f android/keystore/drc-tourbillion.p12
            git commit -m 'Add the Android signing key [skip ci]'
            git push
          fi
      - name: Build the APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Publish the APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DRC Golf Tourbillion build ${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
